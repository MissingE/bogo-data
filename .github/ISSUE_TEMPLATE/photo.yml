name: 사진 바꾸기
description: 월드 액자의 사진을 바꿉니다
title: "[사진] "
body:
  - type: input
    id: frame
    attributes:
      label: 액자 번호
      description: 사진 관리 페이지에서 [사진 바꾸기]를 누르면 자동으로 채워집니다.
      placeholder: "예: 7"
    validations:
      required: true
  - type: textarea
    id: photo
    attributes:
      label: 사진
      description: 여기에 사진 한 장을 끌어다 놓으세요.
  - type: checkboxes
    id: reset
    attributes:
      label: 되돌리기
      options:
        - label: 사진을 빼고 번호 그림으로 되돌립니다
