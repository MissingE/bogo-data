# [사진 바꾸기] 이슈가 올라오면 그 액자 사진을 바꾸고 월드에 반영한 뒤 답글을 남기고 이슈를 닫는다
name: 사진 바꾸기

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: photo
  cancel-in-progress: false

jobs:
  apply:
    if: startsWith(github.event.issue.title, '[사진]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 그림 도구 설치
        run: |
          pip install pillow==11.1.0
          pip install pillow-heif==0.21.0 || echo "heic 지원 없이 진행합니다"
      - name: 사진 넣기
        id: photo
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          AUTHOR_ASSOC: ${{ github.event.issue.author_association }}
        run: python .github/bogo/photo.py
      - name: 저장하고 월드에 반영
        if: steps.photo.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WHO: ${{ github.event.issue.user.login }}
          WHO_ID: ${{ github.event.issue.user.id }}
          FRAME: ${{ steps.photo.outputs.frame }}
        run: |
          git config user.name "$WHO"
          git config user.email "$WHO_ID+$WHO@users.noreply.github.com"
          git add -A images
          if ! git diff --cached --quiet; then
            git commit -m "${FRAME}번 액자 사진 바꿈"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          gh workflow run publish.yml --ref main
      - name: 답글 남기고 닫기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -f "$RUNNER_TEMP/result.md" ]; then
            gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/result.md"
          else
            gh issue comment "$NUMBER" --body "처리하다 문제가 생겼습니다. 잠시 뒤 다시 올려 주세요."
          fi
          gh issue close "$NUMBER"
